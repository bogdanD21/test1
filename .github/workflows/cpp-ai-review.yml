name: C++ AI Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers requests

      - name: Run C++ AI Review and Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'EOF'
          import os
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer
          import requests

          # Используем модель CodeT5-small для анализа кода
          model_name = "Salesforce/codet5-small"
          tokenizer = AutoTokenizer.from_pretrained(model_name)
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name)

          # Собираем все C++ файлы из PR
          cpp_files = []
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f.endswith(".cpp") or f.endswith(".h"):
                      cpp_files.append(os.path.join(root, f))

          # Функция, которая анализирует файл и возвращает комментарий
          def review_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()
              prompt = f"### Analyze the following C++ code and give suggestions for improvement. Use Russian language.\n\n{code}\n\n### Review:"
              inputs = tokenizer(prompt, return_tensors="pt", truncation=True, max_length=1024)
              outputs = model.generate(**inputs, max_new_tokens=300)
              return tokenizer.decode(outputs[0], skip_special_tokens=True)

          review_text = ""
          for f in cpp_files:
              review_text += f"// File: {f}\n"
              review_text += review_file(f) + "\n\n"

          # Публикуем комментарий в PR
          pr_number = os.getenv("PR_NUMBER")
          repo = os.getenv("GITHUB_REPOSITORY")
          url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          headers = {"Authorization": f"Bearer {os.getenv('GITHUB_TOKEN')}"}

          resp = requests.post(url, json={"body": f"### 🤖 AI Review Feedback\n{review_text}"}, headers=headers)
          print(resp.status_code, resp.text)
          EOF
